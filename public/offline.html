<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CaisseBi — Hors ligne</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: #f5f7fb;
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          Roboto,
          Arial,
          sans-serif;
        color: #182b6b;
        text-align: center;
      }
      .card {
        max-width: 26rem;
      }
      .badge {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: #182b6b;
        color: #f5a524;
        font-weight: 800;
        font-size: 1.75rem;
        letter-spacing: -0.05em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4b5568;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        border: none;
        background: #182b6b;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">CB</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        CaisseBi n'a pas pu joindre le serveur. Vérifiez votre connexion internet, puis réessayez — vos ventes ne
        sont pas enregistrées sans connexion.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
